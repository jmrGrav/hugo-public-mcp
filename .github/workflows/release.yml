name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/hugo-public-mcp ./cmd/hugo-public-mcp

      - name: Create checksum
        run: sha256sum dist/hugo-public-mcp > dist/SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/hugo-public-mcp
            dist/SHA256SUMS
